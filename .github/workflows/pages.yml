name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # No build step: the app runs as-is. Stage everything except repo-only files,
      # so new source folders (modules, bundled data) are published without editing this list.
      - name: Stage site
        run: |
          rsync -a \
            --exclude='.*' \
            --exclude='_site' \
            --exclude='docs' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
